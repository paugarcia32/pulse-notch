name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release version
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw Sources/PulseNotchApp/Info.plist)
          tag_version=${GITHUB_REF_NAME#v}

          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vX.Y.Z format: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if [[ "$tag_version" != "$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build release DMG
        run: ./Scripts/build-dmg.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/PulseNotch-$VERSION.dmg" \
            "dist/PulseNotch-$VERSION.dmg.sha256" \
            --verify-tag \
            --title "Pulse Notch $VERSION" \
            --generate-notes
